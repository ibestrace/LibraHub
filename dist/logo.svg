<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#gradientBg)" filter="url(#shadow)"/>
  
  <!-- Book Icon -->
  <g transform="translate(30, 28)">
    <!-- Book Cover -->
    <path d="M5 55.5C5 52.4624 7.46243 50 10.5 50H55V8H10.5C7.46243 8 5 10.4624 5 13.5V55.5Z" 
          stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Book Pages -->
    <path d="M55 8V50" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M55 50H10.5C7.46243 50 5 52.4624 5 55.5C5 58.5376 7.46243 61 10.5 61H55V50Z" 
          stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Book Lines (Text Simulation) -->
    <line x1="15" y1="20" x2="45" y2="20" stroke="url(#gradientAccent)" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="30" x2="40" y2="30" stroke="url(#gradientAccent)" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="40" x2="35" y2="40" stroke="url(#gradientAccent)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Decorative Dots -->
  <circle cx="95" cy="25" r="4" fill="white" opacity="0.6"/>
  <circle cx="105" cy="35" r="2.5" fill="white" opacity="0.4"/>
</svg>
